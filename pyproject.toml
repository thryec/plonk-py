[project]
name = "plonk-py"
version = "0.1.0"
description = "From-scratch implementation of PLONK in Python"
requires-python = "==3.9.*"
dependencies = [
    "numpy",
    "scipy",
    "galois",
    "py-ecc",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
pythonpath = [
    "polynomials",
    "elliptic-curves-pairings",
    "kzg-commitments",
]
testpaths = [
    "polynomials",
    "elliptic-curves-pairings",
    "kzg-commitments",
]
